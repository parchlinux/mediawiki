server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 128M;
    client_body_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MediaWiki Short URL handling
    location /wiki/ {
        rewrite ^/wiki/(.*)$ /index.php?title=$1&$args last;
    }

    location = / {
        return 301 /wiki/Main_Page;
    }

    # Static assets caching & fallback
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @mediawiki;
    }

    # Deny PHP script execution inside /images/ and /cache/
    location ~* ^/(images|cache)/.*\.php$ {
        deny all;
        return 403;
    }

    # Protect internal / sensitive files and directories
    location ~* ^/(conf\.d|\.git|\.env|maintenance|tests|serialized|includes|languages)/ {
        deny all;
        return 403;
    }

    location ~* \.(json|lock|yml|yaml|sql|md|ini|sh|bak|dist)$ {
        deny all;
        return 403;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY ""; # Mitigate HTTPOXY vulnerability
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }

    # Fallback
    location / {
        try_files $uri $uri/ @mediawiki;
    }

    location @mediawiki {
        rewrite ^/(.*)$ /index.php?title=$1&$args;
    }
}
